name: Bug
description: Something is broken, or behaves differently than the docs say.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Point to the doc or test that says so, if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID
      description: From the `X-Request-Id` header or the error body. It points to the exact log lines.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Local (my laptop)
        - CI
        - Production (Render)
    validations:
      required: true
